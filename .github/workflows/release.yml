name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win -- --publish never
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Package installer and checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/RoleFit-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Copy-Item README.md release/README.md
          Compress-Archive -Path $setup.FullName,release/README.md,release/SHA256SUMS.txt -DestinationPath "release/RoleFit-Windows-${{ steps.version.outputs.tag }}.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RoleFit ${{ steps.version.outputs.tag }} · Windows 桌面版
          body: |
            ## RoleFit 一键生成简历
            面向个人求职者的开源中文岗位定制简历工具，支持 DeepSeek 生成、逐段编辑和 Word / PDF 导出。

            ### 下载与安装
            下载下方 RoleFit-Windows ZIP，解压后运行 Setup 安装向导。Windows x64；无需自行安装 Node.js。

            ### 首次使用
            打开右上角「DeepSeek 设置」，填写自己的 API Key，测试连接并选择模型。可选择 Windows 加密保存，或仅本次运行使用。不配置 Key 也能体验本地草稿、编辑和导出。

            ### 隐私与费用
            资料默认保存在本机，AI 请求直接发送至 DeepSeek。软件免费，API 调用费用由用户自己的 DeepSeek 账户承担。投递前请核对事实，模拟项目不得冒充真实经历。

            安装程序未购买商业签名，Windows 可能显示未知发布者；可用 SHA256SUMS.txt 核验文件。
          generate_release_notes: true
          files: |
            release/RoleFit-Windows-${{ steps.version.outputs.tag }}.zip
            release/RoleFit-Setup-*.exe
            release/SHA256SUMS.txt

